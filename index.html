<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Meeting Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wdth,wght@75..125,300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;0,700;1,300;1,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style_5.css">
</head>
<body class="start">

    <div class="container">
        <div id="startScreen">
            <div id="startTitle">Team Meeting</div>
            <div id="startIcons">
                <picture><source srcset="https://fonts.gstatic.com/s/e/notoemoji/latest/1f3c6/512.webp" type="image/webp"><img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f3c6/512.gif"></picture>
                <picture><source srcset="https://fonts.gstatic.com/s/e/notoemoji/latest/1f9e0/512.webp" type="image/webp"><img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f9e0/512.gif"></picture>
                <picture><source srcset="https://fonts.gstatic.com/s/e/notoemoji/latest/2699_fe0f/512.webp" type="image/webp"><img src="https://fonts.gstatic.com/s/e/notoemoji/latest/2699_fe0f/512.gif"></picture>
                <picture><source srcset="https://fonts.gstatic.com/s/e/notoemoji/latest/1f680/512.webp" type="image/webp"><img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f680/512.gif"></picture>
                <picture><img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f4cf/512.png"></picture>
                <picture><source srcset="https://fonts.gstatic.com/s/e/notoemoji/latest/1f4b8/512.webp" type="image/webp"><img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f4b8/512.gif"></picture>
            </div>
        </div>
        <div id="teamName"></div>
        <div id="teamIcon">
            <picture id="icon-recruitment" class="team-icon">
                <source srcset="https://fonts.gstatic.com/s/e/notoemoji/latest/1f3c6/512.webp" type="image/webp">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f3c6/512.gif" alt="Trophy">
            </picture>
            <picture id="icon-research" class="team-icon">
                <source srcset="https://fonts.gstatic.com/s/e/notoemoji/latest/1f9e0/512.webp" type="image/webp">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f9e0/512.gif" alt="Brain">
            </picture>
            <picture id="icon-ops" class="team-icon">
                <source srcset="https://fonts.gstatic.com/s/e/notoemoji/latest/2699_fe0f/512.webp" type="image/webp">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/2699_fe0f/512.gif" alt="Gear">
            </picture>
            <picture id="icon-ceip" class="team-icon">
                <source srcset="https://fonts.gstatic.com/s/e/notoemoji/latest/1f680/512.webp" type="image/webp">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f680/512.gif" alt="Rocket">
            </picture>
            <picture id="icon-mel" class="team-icon">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f4cf/512.png" alt="Ruler">
            </picture>
            <picture id="icon-philanthropy" class="team-icon">
                <source srcset="https://fonts.gstatic.com/s/e/notoemoji/latest/1f4b8/512.webp" type="image/webp">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f4b8/512.gif" alt="Money with wings">
            </picture>
            <div id="icon-winner" class="team-icon"><span></span></div>
            <picture id="icon-end" class="team-icon">
                <source srcset="https://fonts.gstatic.com/s/e/notoemoji/latest/1f389/512.webp" type="image/webp">
                <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f389/512.gif" alt="Party">
            </picture>
        </div>
        <div id="wheelBox" style="display:none;">
            <div class="wheel-wrap">
                <div class="wheel-pointer"></div>
                <div id="wheelRotor" class="wheel-rotor"></div>
            </div>
            <div><button id="spinWheel" class="break-btn">Spin!</button></div>
        </div>
        <div id="animalGif" style="display:none;">
            <img id="animalImg" src="" alt="Cute animal">
            <div>
                <button id="anotherGif" class="break-btn">Another</button>
                <button id="spinAgain" class="break-btn">Spin Again</button>
            </div>
            <div class="giphy-credit">Powered by GIPHY</div>
        </div>
        <!-- #adventure mode: shown on the slide behind the full-screen game (see adventure.js) -->
        <div id="adventureBox" style="display:none;">
            <div>
                <button id="adventurePlayAgain" class="break-btn">Back into the village</button>
                <button id="adventureSpinAgain" class="break-btn">Spin Again</button>
            </div>
        </div>
        <div id="timer" class="timer"></div>
        <div id="weeklyPrompt"></div>
    </div>


      
    <button id="nextTeam">Start</button>
    <button id="pauseTimer" title="Pause (space)" style="display:none;">&#x23F8;&#xFE0E;</button>

    <audio id="timerSound" src="chime.mp3" preload="auto"></audio>

    <!-- Farm animals that peek from edges -->
    <div id="animal-pig" class="farm-animal peek-left">
        <picture>
            <source srcset="https://fonts.gstatic.com/s/e/notoemoji/latest/1f416/512.webp" type="image/webp">
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f416/512.gif" alt="Pig">
        </picture>
        <span class="heart h1">&#x2764;</span>
        <span class="heart h2">&#x2764;</span>
        <span class="heart h3">&#x2764;</span>
    </div>
    <div id="animal-chicken" class="farm-animal peek-right">
        <picture>
            <source srcset="https://fonts.gstatic.com/s/e/notoemoji/latest/1f425/512.webp" type="image/webp">
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f425/512.gif" alt="Chick">
        </picture>
        <span class="heart h1">&#x2764;</span>
        <span class="heart h2">&#x2764;</span>
        <span class="heart h3">&#x2764;</span>
    </div>
    <div id="animal-cow" class="farm-animal peek-top">
        <picture>
            <source srcset="https://fonts.gstatic.com/s/e/notoemoji/latest/1f42e/512.webp" type="image/webp">
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f42e/512.gif" alt="Cow">
        </picture>
        <span class="heart h1">&#x2764;</span>
        <span class="heart h2">&#x2764;</span>
        <span class="heart h3">&#x2764;</span>
    </div>

    <!-- #adventure mode: the full-screen village and Main Stage, opened by adventure.js -->
    <div id="adventureScreen">
        <section id="advWorld" class="adv-screen">
            <canvas id="advMap"></canvas>
            <div class="adv-hud">
                <div class="adv-town" id="advTown">AIM</div>
                <div class="adv-hint">arrow keys or WASD to walk<br>walk up to anyone · walk into the Main Stage to go in</div>
            </div>
            <div id="advBubble"></div>
        </section>
        <section id="advTent" class="adv-wing"><div class="adv-inner">
            <button class="adv-back" id="djBack">← back to the village</button>
            <p class="adv-eyebrow">Main Stage</p>
            <h2>Main Stage</h2>
            <canvas id="djStage"></canvas>
            <div class="deck">
                <button class="tbtn" id="djPlay">▶ Play the set</button>
                <button class="tbtn cyan" id="djDrop">DROP IT</button>
                <div class="tracks" id="djTracks"><span class="tlbl">TRACKS</span></div>
                <div class="knob"><label for="djBpm">Tempo <span id="djBpmv">132</span></label><input type="range" id="djBpm" min="118" max="150" value="132"></div>
                <div class="knob"><label for="djFilt">Filter</label><input type="range" id="djFilt" min="0" max="100" value="100"></div>
                <div class="knob"><label for="djDly">Reverb / delay</label><input type="range" id="djDly" min="0" max="100" value="25"></div>
                <div class="knob"><label for="djCut">Acid cutoff</label><input type="range" id="djCut" min="0" max="100" value="40"></div>
                <div class="knob"><label for="djRes">Squelch</label><input type="range" id="djRes" min="0" max="100" value="55"></div>
                <div class="knob"><label for="djHatd">Hat chaos</label><input type="range" id="djHatd" min="0" max="100" value="30"></div>
                <div class="knob"><label for="djDrive">Drive</label><input type="range" id="djDrive" min="0" max="100" value="35"></div>
            </div>
            <p id="djPhase"></p>
        </div></section>
        <button id="advClose" title="Leave the game (Esc)" aria-label="Leave the game">✕</button>
        <div id="djShout"></div>
    </div>

    <script src="weekly_prompts_5.js"></script>
    <script src="adventure.js"></script>
    <script src="script_6.js"></script>


</body>
</html>
